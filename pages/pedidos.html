<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de pedidos - Cafetería</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- defer: el script se ejecuta cuando el DOM ya está construido -->
    <script src="../js/pedidos.js" defer></script>
  </head>
  <body class="bg-light">
    <main class="container py-4" style="max-width: 900px">
      <h1 class="h3 mb-4 text-center">Gestión de pedidos de la cafetería</h1>

      <!-- Formulario de registro -->
      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3">Nuevo pedido</h2>
          <form id="formPedido" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="inputProducto" class="form-label">Producto</label>
                <input type="text" id="inputProducto" class="form-control" placeholder="Café americano" />
                <div class="invalid-feedback" id="errorProducto"></div>
              </div>
              <div class="col-6 col-md-3">
                <label for="inputPrecio" class="form-label">Precio unitario ($)</label>
                <input type="number" id="inputPrecio" class="form-control" step="0.01" placeholder="2.50" />
                <div class="invalid-feedback" id="errorPrecio"></div>
              </div>
              <div class="col-6 col-md-3">
                <label for="inputCantidad" class="form-label">Cantidad</label>
                <input type="number" id="inputCantidad" class="form-control" step="1" placeholder="3" />
                <div class="invalid-feedback" id="errorCantidad"></div>
              </div>
            </div>
            <button type="button" id="btnAgregar" class="btn btn-primary mt-3">Agregar pedido</button>
          </form>
        </div>
      </section>

      <!-- Filtro -->
      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3">Filtrar por precio</h2>
          <div class="row g-2 align-items-start">
            <div class="col-md-4">
              <label for="inputPrecioMax" class="form-label visually-hidden">Precio máximo</label>
              <input type="number" id="inputPrecioMax" class="form-control" step="0.01" min="0" placeholder="Precio máximo ($)" />
              <div class="invalid-feedback">Ingrese un precio máximo válido (0 o mayor).</div>
            </div>
            <div class="col-auto d-flex gap-2">
              <button type="button" id="btnFiltrar" class="btn btn-outline-primary">Filtrar productos</button>
              <button type="button" id="btnMostrarTodos" class="btn btn-outline-secondary">Mostrar todos</button>
              <button type="button" id="btnLimpiar" class="btn btn-outline-danger">Limpiar pedidos</button>
            </div>
          </div>
          <p id="estadoFiltro" class="small text-muted mt-2 mb-0"></p>
        </div>
      </section>

      <!-- Tabla -->
      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">Producto</th>
                  <th scope="col" class="text-end">Precio unitario</th>
                  <th scope="col" class="text-end">Cantidad</th>
                  <th scope="col" class="text-end">Subtotal</th>
                </tr>
              </thead>
              <tbody id="cuerpoTabla"></tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between flex-wrap gap-2 mt-3 fw-semibold">
            <span>Total de unidades: <span id="totalUnidades">0</span></span>
            <span>Monto total: $<span id="montoTotal">0.00</span></span>
          </div>
        </div>
      </section>

      <a href="../index.html" class="btn btn-secondary">Regresar</a>
    </main>
  </body>
</html>
